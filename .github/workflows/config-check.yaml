
name: esphome-check

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Generate dummy secrets
        run: |
          set -euo pipefail
          while read -r name; do
            case "$name" in
              wifi_ssid)
                value="Dummy-WiFi"
                ;;
              wifi_password)
                value="dummy-wifi-password"
                ;;
              mqtt_user)
                value="dummy-mqtt-user"
                ;;
              mqtt_password)
                value="dummy-mqtt-password"
                ;;
              *)
                value="dummy-secret"
                ;;
            esac
          
            echo "${name}: \"${value}\""
          done < <(
            grep -rhoE '!secret +[A-Za-z0-9_]+' \
              --include='*.yaml' --include='*.yml' . |
            awk '{print $2}' | sort -u
          ) > secrets.yaml
          cat secrets.yaml

      - name: Validate ESPHome configurations
        run: |
          set -euo pipefail
          for config in samsung-hvac-bus.yaml samsung-nasa.yaml; do
            echo "::group::Validating ${config}"
            docker run --rm \
              -v "$PWD":/config \
              -w /config \
              ghcr.io/esphome/esphome:2026.10.0 \
              config "${config}"
            echo "::endgroup::"
          done
